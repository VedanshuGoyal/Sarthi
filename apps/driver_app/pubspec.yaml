name: driver_app
description: "Sarthi Driver — the driver-facing ride-hailing app."
publish_to: 'none'
version: 1.3.0+4

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # --- Shared design system ---
  # Deep Signal theme + reusable widgets common to both Sarthi apps.
  sarthi_shared:
    path: ../../shared

  # --- State management ---
  # Predictable, testable state across the app (per project guidelines).
  flutter_riverpod: ^2.6.1

  # --- REST transport ---
  # HTTP client for auth/registration against the Go backend.
  http: ^1.2.2

  # --- Secure storage ---
  # Persists the driver's auth session (bearer token) in the OS keychain/keystore.
  flutter_secure_storage: ^10.3.1

  # --- Real-time transport ---
  # WebSocket client used to receive ride offers and stream GPS to the Go backend.
  web_socket_channel: ^3.0.1

  # --- Location ---
  # Foreground/background location tracking for the "Go Online" driver flow.
  geolocator: ^13.0.2

  # --- Maps ---
  # Map UI for the home screen and active-job navigation. Maps_flutter == google_maps_flutter.
  google_maps_flutter: ^2.9.0

  # --- Photo capture ---
  # Selfie + document (Aadhar/DL) photo capture for the post-registration
  # document verification flow.
  image_picker: ^1.1.2

  # --- On-device file locations ---
  # image_picker hands back a path in the OS cache directory, which Android
  # reclaims whenever it wants space. Captures are copied into the app's
  # documents directory so a half-finished onboarding survives a restart.
  path_provider: ^2.1.4

  # --- System permissions ---
  # Deep-links to the OS settings screens the "Go Online" flow depends on:
  # display-over-other-apps, background location, unrestricted battery usage.
  permission_handler: ^11.3.1

  # --- MCP agent inspection (debug only) ---
  # Lets the flutter-mcp-toolkit server drive/inspect this app. No-op in release.
  mcp_toolkit: ^3.0.0

  # --- Hand-offs to other apps ---
  # Opens turn-by-turn navigation in Google Maps and the dialer to call the
  # customer from a ride's detail screen.
  url_launcher: ^6.3.3
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  flutter_local_notifications: ^22.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Readable assertions for unit tests (per project guidelines).
  checks: ^0.3.0

flutter:
  uses-material-design: true
