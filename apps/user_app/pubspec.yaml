name: user_app
description: "MOJUD — the customer-facing ride-hailing app."
publish_to: 'none'
version: 1.4.0+6

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # --- Shared design system ---
  # Ultramarine theme + reusable widgets common to both Sarthi apps.
  sarthi_shared:
    path: ../../shared

  # --- State management ---
  # Predictable, testable state across the app (per project guidelines).
  flutter_riverpod: ^2.6.1

  # --- REST transport ---
  # HTTP client for auth/registration against the Go backend.
  http: ^1.2.2

  # --- Real-time transport ---
  # WebSocket client: receive driver locations + ride-status updates from the Go backend.
  web_socket_channel: ^3.0.1

  # --- Location ---
  # Pickup detection and live location for the home/search flow.
  geolocator: ^13.0.2

  # --- Maps ---
  # Map UI for destination search and live ride tracking. Maps_flutter == google_maps_flutter.
  google_maps_flutter: ^2.9.0

  # On web the Google Maps JS SDK must be injected into the page; we do that from
  # Dart (keyed off the .env MAPS_API_KEY) using package:web's DOM bindings.
  web: ^1.1.1

  # --- MCP agent inspection (debug only) ---
  # Lets the flutter-mcp-toolkit server drive/inspect this app. No-op in release.
  mcp_toolkit: ^3.0.0
  flutter_secure_storage: ^10.3.1
  google_fonts: ^8.2.0

  # --- Hand-offs to other apps ---
  # Calls the assigned driver from the "Your rides" card.
  url_launcher: ^6.3.3
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  flutter_local_notifications: ^22.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Readable assertions for unit tests (per project guidelines).
  checks: ^0.3.0

  # Virtual clock for deterministically testing timers (OTP resend cooldown).
  fake_async: ^1.3.1

flutter:
  uses-material-design: true
  assets:
    # Route-overview map pins. 2.0x/ and 3.0x/ siblings are picked up
    # automatically as density variants of these declared assets.
    - assets/markers/pin_origin.png
    - assets/markers/pin_destination.png
    - assets/map_styles/
