# Local Postgres for the Sarthi backend — development only.
#
#   docker compose up -d
#
# Production does NOT use this file, or Docker at all: the VPS runs Postgres,
# the server and Caddy natively under systemd (see deploy/README.md). The
# postgres:17 tag here is kept in step with the version deploy/setup-vps.sh
# installs, so dev and production do not drift apart.
#
# On first boot Postgres runs every script in /docker-entrypoint-initdb.d, so
# each forward migration is mounted there and the full schema exists
# immediately. Add new migrations to this list as they are written — but note
# the init hook only runs on an *empty* data volume, so for an existing DB use
# ./scripts/run-backend.sh (it replays every migration on each start).
#
# Only *.up.sql is mounted, never the .down.sql rollbacks — the whole
# migrations dir cannot be mounted because Postgres would run the files in
# alphabetical order and each `down` would execute before its `up`.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: sarthi
      POSTGRES_PASSWORD: sarthi
      POSTGRES_DB: sarthi
    ports:
      - "5432:5432"
    volumes:
      - sarthi_pgdata:/var/lib/postgresql/data
      - ./migrations/0001_create_users.up.sql:/docker-entrypoint-initdb.d/0001_create_users.sql:ro
      - ./migrations/0002_create_sessions.up.sql:/docker-entrypoint-initdb.d/0002_create_sessions.sql:ro
      - ./migrations/0003_create_recent_pickups.up.sql:/docker-entrypoint-initdb.d/0003_create_recent_pickups.sql:ro
      - ./migrations/0004_create_cars.up.sql:/docker-entrypoint-initdb.d/0004_create_cars.sql:ro
      - ./migrations/0005_create_bookings.up.sql:/docker-entrypoint-initdb.d/0005_create_bookings.sql:ro
      - ./migrations/0006_create_drivers.up.sql:/docker-entrypoint-initdb.d/0006_create_drivers.sql:ro
      - ./migrations/0007_create_driver_sessions.up.sql:/docker-entrypoint-initdb.d/0007_create_driver_sessions.sql:ro
      - ./migrations/0008_create_driver_kyc.up.sql:/docker-entrypoint-initdb.d/0008_create_driver_kyc.sql:ro
      - ./migrations/0009_booking_rides.up.sql:/docker-entrypoint-initdb.d/0009_booking_rides.sql:ro
      - ./migrations/0010_booking_start_otp.up.sql:/docker-entrypoint-initdb.d/0010_booking_start_otp.sql:ro
      - ./migrations/0011_push_tokens.up.sql:/docker-entrypoint-initdb.d/0011_push_tokens.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sarthi -d sarthi"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  sarthi_pgdata:
