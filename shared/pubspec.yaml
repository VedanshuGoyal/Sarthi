name: sarthi_shared
description: "Shared Sarthi design system — colours, theme, and reusable UI widgets used by both the user and driver apps."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # --- State management ---
  # ThemeModeController (system/light/dark toggle) is a Riverpod Notifier so
  # both apps share one implementation of the mode-switching behaviour.
  flutter_riverpod: ^2.6.1

  # --- Type ---
  # Deep Signal's Instrument Sans / JetBrains Mono type ramp.
  google_fonts: ^8.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Readable assertions for unit tests (per project guidelines).
  checks: ^0.3.0

flutter:
  uses-material-design: true
